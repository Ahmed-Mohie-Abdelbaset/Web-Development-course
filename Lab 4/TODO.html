<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="TODO.css" />
</head>
<body>
    <div class="container">
        <h1>Todo App</h1>
        <div class="input-area">
            <input type="text" id="todoInput" placeholder="What needs doing?" />
            <button id="addBtn">Add</button>
        </div>
        
        <p class="tip">Tip: double-click a todo to edit. Press Enter to save.</p>
        
        <div class="filter-area">
            <button id="filterAll" class="active">All</button>
            <button id="filterActive">Active</button>
            <button id="filterCompleted">Completed</button>
        </div>

        <ul id="todoList"></ul>

        <div class="footer-area">
            <span id="itemsLeft">0 items left</span>
            <div>
                <button id="clearCompleted">Clear completed</button>
                <button id="clearAll">Clear all</button>
            </div>
        </div>
    </div>

    <!-- Script src points to the transpiled JS file -->
    <script src="TODO.js"></script>
</body>
</html>
